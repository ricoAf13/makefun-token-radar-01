<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vanguard Token Launch Radar</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="header">
    <div class="brand">
      <h1>VANGUARD RADAR</h1>
      <span class="badge">LIVE TRACKER</span>
    </div>
    <div class="metrics" id="metrics"></div>
  </header>

  <main class="container">
    <div class="toolbar">
      <input type="text" id="search" placeholder="Search protocol, category, or chain..." class="input">
      <div class="filters" id="categories"></div>
    </div>

    <div class="table-card">
      <table class="radar-table">
        <thead>
          <tr>
            <th>Rank</th>
            <th>Protocol</th>
            <th>Category</th>
            <th>Chains</th>
            <th>TVL</th>
            <th>Implied Value</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="board-body"></tbody>
      </table>
    </div>
  </main>

  <div class="modal hidden" id="modal">
    <div class="modal-backdrop" id="modal-close"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title">Protocol Details</h2>
        <button class="btn-close" id="modal-btn-close">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script src="../data.js"></script>
  <script src="app.js"></script>
</body>
</html>
